<!-- Chat Widget Script -->
<script>
  const toggleBtn = document.getElementById('ai-chat-toggle');
  const closeBtn = document.getElementById('ai-chat-close');
  const chatWindow = document.getElementById('ai-chat-window');
  const sendBtn = document.getElementById('ai-chat-send');
  const inputField = document.getElementById('ai-chat-input');
  const messagesContainer = document.getElementById('ai-chat-messages');
  // Toggle Chat Window Open/Close
  toggleBtn.addEventListener('click', () => {
    chatWindow.classList.toggle('hidden');
  });
  closeBtn.addEventListener('click', () => {
    chatWindow.classList.add('hidden');
  });
  // Handle Send Message
  function handleSendMessage() {
    const text = inputField.value.trim();
    if (!text) return;
    // User Message Append
    appendMessage(text, 'user');
    inputField.value = '';
    // Simulated AI Response
    setTimeout(() => {
      let botReply = "Aapke is sawal ke liye jald hi update yahan list ki jayegi. Aap upar diye gaye sections (Academics, Placement Prep, Govt Exams) ko check kar sakte hain!";
      
      const lowerText = text.toLowerCase();
      if(lowerText.includes('exam') || lowerText.includes('govt')) {
        botReply = "Govt Exams section me aapko latest competition exams, syllabus, aur preparation material mil jayega.";
      } else if(lowerText.includes('placement') || lowerText.includes('prep')) {
        botReply = "Placement Prep ke liye coding resources, aptitude tests, aur mock interviews ki details jald hi update ho rahi hain!";
      } else if(lowerText.includes('scholarship')) {
        botReply = "Scholarships section me current open scholarships aur unki eligibility criteria ki puri jankari di gayi hai.";
      }
      appendMessage(botReply, 'bot');
    }, 600);
  }
  function appendMessage(text, sender) {
    const msgDiv = document.createElement('div');
    if(sender === 'user') {
      msgDiv.className = "bg-cyan-600 text-white p-3 rounded-xl ml-auto max-w-[85%] text-xs shadow-md";
    } else {
      msgDiv.className = "bg-slate-800 text-slate-200 p-3 rounded-xl mr-auto max-w-[85%] text-xs border border-slate-700 shadow-md";
    }
    msgDiv.innerText = text;
    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }
  window.sendPresetMessage = function(presetText) {
    inputField.value = presetText;
    handleSendMessage();
  }
  sendBtn.addEventListener('click', handleSendMessage);
  inputField.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      handleSendMessage();
    }
  });
</script>
